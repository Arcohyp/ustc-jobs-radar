# 求职画像示例配置。复制为 profile.yaml 后按自己的求职意向修改：
#   cp profile.example.yaml profile.yaml
# profile.yaml 为个人私有文件，已在 .gitignore 中排除，不会被提交。

# 目标企业：出现在宣讲会标题里即命中，value 为额外别名列表
target_companies:
  华为: []
  腾讯: []
  阿里巴巴: ["阿里"]

# 值得一看：非目标清单但方向相关，value 为显示在报告里的理由
worth_a_look:
  商汤: AI 视觉方向示例
  旷视: AI 视觉方向示例

# 方向关键词：兜底打分，标题命中 >=2 个进入"方向相关"档
direction_keywords:
  - 算法
  - 视觉
  - AI
  - 人工智能
  - 大模型
  - 机器人
  - 芯片
  - 软件

# 央国企信号词：标题出现则标记到独立分档提醒（可自行增删）
soe_hints:
  - 中物院
  - 中核
  - 航天
  - 中电科
  - 国家电网
  - 中国移动
  - 银行

# 例外名单：命中 soe_hints 但不标记（如本地可接受的央国企）
soe_allowed: []

# JD 正文强关键词：标题未命中时兜底，正文命中 >=2 个进"JD 正文命中"档
# （详情正文缓存覆盖全部未开始场次，首次全量补抓约几分钟，之后每天增量很小）
jd_keywords:
  - 计算机视觉
  - 深度学习
  - 大模型
  - 具身智能
  - 自动驾驶
  - 机器学习

# 可选：国企名录文件 soe_names.txt（一行一个公司名，放在项目根目录即自动生效，
# 标题包含名录内公司名或其短名（去公司后缀）即标记国企属性）
# 注意：请使用你自己合法持有的名录，该文件已在 .gitignore 中排除

# 日程图分级（render_schedule.py 用）：按宣讲会标题关键词归入 A/B/C 档
schedule:
  tiers:
    A: ["华为"]
    B: ["商汤"]
    C: []
  short_names: {}
  notes: []
